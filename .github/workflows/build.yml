name: Build Edina Little World APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Flutter project
        run: |
          flutter create \
            --project-name edina_little_world \
            --org com.edina \
            /tmp/edina_app

      - name: Copy Edina source
        run: |
          cp pubspec.yaml /tmp/edina_app/pubspec.yaml
          rm -rf /tmp/edina_app/lib
          cp -r lib /tmp/edina_app/lib

      - name: Get dependencies
        working-directory: /tmp/edina_app
        run: flutter pub get

      - name: Build APK
        working-directory: /tmp/edina_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Edina-Little-World-debug-APK
          path: /tmp/edina_app/build/app/outputs/flutter-apk/app-debug.apk
