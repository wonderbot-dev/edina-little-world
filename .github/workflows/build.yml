name: Build Edina Little World APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create \
            --project-name edina_little_world \
            --org com.edina \
            --platforms=android \
            .

      - name: Get dependencies
        run: flutter pub get

      - name: Build Edina APK
        run: flutter build apk --debug --build-name=1.0.1 --build-number=2

      - name: Upload Edina APK
        uses: actions/upload-artifact@v4
        with:
          name: Edina-Little-World-v1.0.1-APK
          path: build/app/outputs/flutter-apk/app-debug.apk